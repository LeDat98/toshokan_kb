[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libkb"
version = "0.1.0"
description = "LibraryKB — an AI knowledge base the model walks like a physical library"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=1.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-ulid>=2.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.2"]

[project.scripts]
libkb = "libkb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["libkb"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["library"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"libkb/seed.py" = ["E501"]

[tool.pytest.ini_options]
markers = ["llm: tests that call the real Gemini API (cost tokens)"]
addopts = "-m 'not llm'"
testpaths = ["tests"]
