[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libkb"
version = "0.1.0"
description = "LibraryKB — an AI knowledge base the model walks like a physical library"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-genai>=1.0",
    # Alibaba DashScope (Qwen) speaks the OpenAI protocol; the SDK is imported lazily in
    # llm/client.py so the package still works with no DashScope key and no Qwen model configured.
    "openai>=1.40",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-ulid>=2.2",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "pymupdf4llm>=0.0.17",
    "trafilatura>=1.12",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.2"]
# The Model Context Protocol SDK — needed only to talk to a REAL MCP server (Phase C, D-061). The
# tool seam itself (libkb/tools/mcp.py) adapts any callable, so the core works without this.
mcp = ["mcp>=1.0"]

[project.scripts]
libkb = "libkb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["libkb"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["library"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"libkb/seed.py" = ["E501"]
"libkb/api/routes.py" = ["B008"]  # FastAPI File()/Form()/Depends() in defaults is idiomatic

[tool.pytest.ini_options]
markers = ["llm: tests that call the real Gemini API (cost tokens)"]
addopts = "-m 'not llm'"
testpaths = ["tests"]
